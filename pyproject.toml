[tool.poetry]
name = "slowstore"
version = "2.2.1"
description = "File json storage backend for your collections"
authors = ["Costa Halicea <costa@codechem.com>"]

homepage = "https://github.com/42dotmk/slowstore"
repository = "https://github.com/42dotmk/slowstore"
documentation = "https://github.com/42dotmk/slowstore/blob/main/README.md"

license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10"
# Optional: only needed to use Pydantic models (the default `PydanticCodec`).
# `pip install slowstore[pydantic]`. Dataclass/plain models need nothing extra.
pydantic = { version = "^2.8.2", optional = true }

[tool.poetry.extras]
pydantic = ["pydantic"]


[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
debugpy = "^1.8.5"
ipython = "^8.27.0"
# installed for the test suite, which exercises the Pydantic backend
pydantic = "^2.8.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
